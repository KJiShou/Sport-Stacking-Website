name: 🚀 Deploy to Firebase Hosting (Production)

on:
    push:
        branches:
            - main

jobs:
    build_and_deploy:
        runs-on: ubuntu-latest

        steps:
            # Step 1: Checkout Repository
            - name: 📥 Checkout repository
              uses: actions/checkout@v4

            # Step 2: Setup Node.js & Yarn Cache
            - name: ⚙️ Setup Node.js 20.x
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            - name: 🛠 Enable Corepack
              run: corepack enable

            - name: 🎯 Use Yarn 4.6.0
              run: corepack prepare yarn@4.6.0 --activate

            # Step 3: Install Dependencies
            - name: 📦 Install Dependencies
              run: yarn install --immutable

            - name: 🧪 Validate Project
              run: yarn validate

            - name: 🧪 Validate Cloud Functions
              run: |
                  yarn workspace functions lint
                  yarn workspace functions test

            - name: 🔑 Inject Firebase & API Keys to .env
              run: |
                  echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env
                  echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env
                  echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env
                  echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env
                  echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
                  echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env
                  echo "VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}" >> .env
                  echo "VITE_APP_RELEASE=${{ github.sha }}" >> .env
                  echo "VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}" >> .env

            # Step 5: Build Project
            - name: 🛠️ Build Project
              run: yarn build

            - name: 🗺️ Archive production source maps
              uses: actions/upload-artifact@v4
              with:
                  name: web-source-maps-${{ github.sha }}
                  path: dist/**/*.map
                  retention-days: 90
                  if-no-files-found: error

            - name: 🔒 Remove source maps from public Hosting output
              run: find dist -type f -name '*.map' -delete

            - name: 🔐 Authenticate Firebase CLI
              uses: google-github-actions/auth@v3
              with:
                  project_id: sport-stacking-website
                  credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPORT_STACKING_WEBSITE }}
                  create_credentials_file: true

            - name: 🚀 Deploy Firebase backend
              run: |
                  functions/node_modules/.bin/firebase deploy \
                    --project sport-stacking-website \
                    --only functions,firestore:rules,firestore:indexes \
                    --non-interactive \
                    --debug

            - name: 📋 Upload Firebase debug log
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: firebase-debug-log-${{ github.run_id }}
                  path: firebase-debug.log
                  if-no-files-found: ignore
                  retention-days: 7

            # Step 6: Deploy to Firebase Hosting (Live)
            - name: 🚀 Deploy to Firebase Hosting (live)
              uses: FirebaseExtended/action-hosting-deploy@v0
              with:
                  repoToken: ${{ secrets.GITHUB_TOKEN }}
                  firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPORT_STACKING_WEBSITE }}
                  channelId: live
                  projectId: sport-stacking-website
